name: Build & push fork images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/plane

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Frontend JS/turbo : contexte = racine du repo
          - name: frontend
            dockerfile: ./apps/web/Dockerfile.web
            context: .
          - name: space
            dockerfile: ./apps/space/Dockerfile.space
            context: .
          - name: admin
            dockerfile: ./apps/admin/Dockerfile.admin
            context: .
          - name: live
            dockerfile: ./apps/live/Dockerfile.live
            context: .
          # Backend Django : contexte = apps/api (COPY sans prefixe apps/api/)
          - name: backend
            dockerfile: ./apps/api/Dockerfile.api
            context: ./apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max